services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      QDRANT_URL: "http://qdrant:6333"
      RAGOPS_LLM_PROVIDER: "${RAGOPS_LLM_PROVIDER:-template}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5-nano}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
      RAGOPS_TRACE_DB_PATH: "/app/data/traces/ragops_traces.sqlite3"
      RAGOPS_PIPELINE_NAME: "${RAGOPS_PIPELINE_NAME:-dense_baseline}"
      RAGOPS_PIPELINE_VERSION: "${RAGOPS_PIPELINE_VERSION:-1.0.0}"
    volumes:
      - ragops_trace_data:/app/data/traces
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_container
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    container_name: mlflow_container
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts 127.0.0.1:5000,localhost:5000,mlflow:5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  qdrant_storage:
  mlflow_data:
  ragops_trace_data:
