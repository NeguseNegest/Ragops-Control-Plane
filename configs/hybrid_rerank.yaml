name: hybrid_rrf_cross_encoder
retriever_interface: common_v1

input:
  chunks_path: data/processed/chunks.jsonl

dense:
  type: dense
  collection_name: rag_chunks
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 25

bm25:
  type: bm25
  index_path: data/processed/bm25_index.json.gz
  tokenizer: technical_v1
  top_k: 25
  k1: 1.5
  b: 0.75
  epsilon: 0.25

fusion:
  type: rrf
  rank_constant: 60
  top_k: 25

reranker:
  type: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidate_top_k: 25
  top_k: 5
  batch_size: 16
  max_length: 512

evaluation:
  labels_path: data/eval/retrieval_labels.jsonl
  k_values:
    - 1
    - 3
    - 5
  minimum_labels: 40
  dense_baseline_path: reports/evaluations/dense_baseline.json
  bm25_baseline_path: reports/evaluations/bm25_baseline.json
  hybrid_baseline_path: reports/evaluations/hybrid_rrf.json

output:
  directory: reports/evaluations
  comparison_path: reports/evaluations/reranker_vs_baselines.json
  report_path: reports/week4_reranker_comparison.md
