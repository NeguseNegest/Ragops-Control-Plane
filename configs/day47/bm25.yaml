name: final_bm25
version: 1.0.0
status: evaluated
retriever_interface: common_v1

input:
  chunks_path: data/processed/chunks.jsonl

retriever:
  type: bm25
  index_path: data/processed/bm25_index.json.gz
  tokenizer: technical_v1
  top_k: 10
  k1: 1.5
  b: 0.75
  epsilon: 0.25

evaluation:
  labels_path: data/eval/final_retrieval_labels.jsonl
  k_values: [1, 3, 5, 10]
  minimum_labels: 50
  dense_baseline_path: reports/evaluations/final_dense.json

output:
  directory: reports/evaluations
  comparison_path: reports/evaluations/final_bm25_vs_dense.json
  report_path: reports/day47_bm25_vs_dense.md
